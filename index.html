    <style>

            opacity: 0; pointer-events: none; visibility: hidden; transform: scale(0.98); z-index: 0;

            background-color: rgba(99, 102, 241, 0.1) !important;
        }

</head>
<body oncontextmenu="return false;">

                        <input id="i2" type="checkbox" class="w-4 h-4 text-indigo-600 bg-slate-900 border-slate-700 rounded focus:ring-indigo-500 cursor-pointer">
                    </div>
                    <div class="text-xs text-slate-300">
                        <label for="i2" class="font-bold text-white block mb-1 cursor-pointer">本ツールの利用・機密保持に同意する</label>
                        表示されたモデルのスクリーンショットの公開、データ解析、第三者への開示を禁じます。

                        <input type="file" id="i3" class="hidden">

                    エラーが発生しました。

    <div id="p2" class="page-transition hidden-page" style="background-color: #111827;">
        <div id="d2" class="absolute top-[-50%] left-[-50%] w-[200%] h-[200%] z-20 pointer-events-none flex flex-wrap justify-center items-center opacity-[0.07] rotate-[-30deg] select-none text-white text-4xl md:text-5xl font-bold tracking-widest overflow-hidden"></div>
        <div id="c1" class="absolute inset-0 z-10"></div>
        <div class="absolute inset-0 z-30 pointer-events-none flex flex-col justify-between p-4 md:p-6">
            <div class="flex justify-between items-start">
                <div class="bg-slate-900/90 backdrop-blur border border-slate-800 p-3 md:p-4 rounded-xl text-white pointer-events-auto shadow-lg">
                    <div class="flex items-center gap-2">
                        <span class="inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>

                        <i data-lucide="smile" class="w-4 h-4"></i><span>表情 / BlendShape</span>
                    </button>
                    <button onclick="x6()" class="bg-slate-900/90 hover:bg-slate-800 backdrop-blur border border-slate-800 text-slate-300 hover:text-white px-3 py-2 md:px-4 md:py-2.5 rounded-xl flex items-center gap-2 text-xs md:text-sm pointer-events-auto transition-all shadow-lg">

            <div class="flex flex-row gap-2 md:gap-3 justify-between items-end">
                <div id="h1" class="bg-slate-900/90 backdrop-blur border border-slate-800 p-2.5 md:p-4 rounded-xl text-[10px] md:text-xs text-slate-300 space-y-1.5 pointer-events-auto shadow-lg max-w-[200px] md:max-w-sm"></div>
                <button onclick="y9()" class="bg-slate-900/90 hover:bg-slate-800 backdrop-blur border border-slate-800 text-white p-2.5 md:p-3 rounded-xl pointer-events-auto transition-all flex items-center gap-1.5 md:gap-2 text-[10px] md:text-xs shadow-lg h-fit">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5 md:w-4 md:h-4"></i><span>カメラリセット</span>
                </button>
            </div>
        </div>
        <div id="bsPanel" style="display:none" class="absolute z-40 right-4 md:right-6 top-[4.5rem] md:top-24 w-[250px] md:w-[300px] max-h-[calc(100%-10rem)] flex-col bg-slate-900/95 backdrop-blur border border-slate-800 rounded-xl shadow-2xl text-white pointer-events-auto overflow-hidden">
            <div class="flex items-center justify-between gap-2 px-3 py-2.5 border-b border-slate-800 shrink-0">
                <div class="flex items-center gap-2 min-w-0">
                    <i data-lucide="smile" class="w-4 h-4 text-indigo-400 shrink-0"></i>
                    <span class="text-xs font-bold truncate">表情 / BlendShape</span>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                    <button onclick="bsReset()" title="すべてリセット" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button>
                    <button onclick="bsToggle()" title="パネルを閉じる" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors"><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
                </div>
            </div>
            <div id="bsTabs" class="grid grid-cols-4 gap-1 p-2 border-b border-slate-800 text-[10px] md:text-[11px] shrink-0"></div>
            <div class="px-2 pt-2 shrink-0">
                <input id="bsSearch" type="text" placeholder="名前で検索" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-[11px] text-white placeholder:text-slate-500 focus:outline-none focus:border-indigo-500">
            </div>
            <div id="bsBody" class="flex-1 overflow-y-auto mt-2"></div>
        </div>
        <div id="l1" class="absolute inset-0 bg-slate-950/90 backdrop-blur z-50 flex flex-col items-center justify-center text-white transition-opacity duration-300 opacity-0 pointer-events-none">
            <div class="w-16 h-16 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin mb-6"></div>
            <h3 class="text-lg md:text-xl font-bold tracking-tight mb-2">モデルを構築中...</h3>
            <p class="text-xs text-slate-400 mb-2">ブラウザ上で安全に処理しています</p>
        </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        lucide.createIcons();
        const x1 = /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (localStorage.getItem('f1') === '1') {
            localStorage.removeItem('f1');
            setTimeout(() => alert("【システム通知】\n前回の読み込み中にスマートフォンのメモリ（グラフ���ックス処理能力）の限界に達し、OSによりブラウザが強制再起動されました。\n\nこのモデルはスマートフォンでは表示できません。PC環境での確認をお願いいたします。"), 600);
        }

        function x2() {
            const x3 = document.getElementById('h1');
            if (!x3) return;
            if (x1) {
                x3.innerHTML = `<span class="font-semibold text-white block mb-1.5">💡 操作マニュアル</span><div class="flex justify-between items-center"><kbd class="bg-slate-950 px-1.5 py-0.5 rounded text-slate-400 border border-slate-800">1本指ドラッグ</kbd><span>：回転</span></div><div class="flex justify-between items-center"><kbd class="bg-slate-950 px-1.5 py-0.5 rounded text-slate-400 border border-slate-800">2本指ドラッグ</kbd><span>：移動</span></div><div class="flex justify-between items-center"><kbd class="bg-slate-950 px-1.5 py-0.5 rounded text-slate-400 border border-slate-800">ピンチ</kbd><span>：ズーム</span></div>`;
            } else {
                x3.innerHTML = `<span class="font-semibold text-white block mb-1.5">💡 操作マニュアル</span><div class="flex justify-between items-center"><kbd class="bg-slate-950 px-1.5 py-0.5 rounded text-slate-400 border border-slate-800">左ドラッグ</kbd><span>：回転</span></div><div class="flex justify-between items-center mt-1.5"><kbd class="bg-slate-950 px-1.5 py-0.5 rounded text-slate-400 border border-slate-800">右ドラッグ</kbd><span>：移動</span></div><div class="flex justify-between items-center mt-1.5"><kbd class="bg-slate-950 px-1.5 py-0.5 rounded text-slate-400 border border-slate-800">スクロール</kbd><span>：ズーム</span></div>`;
            }
        }
        x2();

        document.addEventListener('dragstart', (e) => e.preventDefault());

        window.x4 = function(x5) {
            document.querySelectorAll('.page-transition').forEach(p => {
                p.classList.remove('active-page');
                p.classList.add('hidden-page');
            });
            document.getElementById(x5).classList.remove('hidden-page');
            document.getElementById(x5).classList.add('active-page');
            if (x5 !== 'p2') w3();
        };

        window.x6 = function() {
            window.x4('p1');
            y8();
            document.getElementById('i3').value = '';
            localStorage.removeItem('f1');
        };

        function x7(x8, x9) {
            if (!x9) return x8;
            const xa = new Uint8Array(x8);
            const xb = new TextEncoder().encode(x9);
            for (let i = 0; i < xa.length; i++) xa[i] ^= xb[i % xb.length];
            return xa.buffer;
        }

        const xc = document.getElementById('d1');
        const xd = document.getElementById('i3');
        xc.addEventListener('click', () => xd.click());
        xc.addEventListener('dragover', (e) => { e.preventDefault(); xc.classList.add('drag-active'); });
        xc.addEventListener('dragleave', () => { xc.classList.remove('drag-active'); });
        xc.addEventListener('drop', (e) => {
            e.preventDefault();
            xc.classList.remove('drag-active');
            if (e.dataTransfer.files.length) xe(e.dataTransfer.files[0]);
        });
        xd.addEventListener('change', (e) => {
            if (e.target.files.length) xe(e.target.files[0]);
        });

        function xe(xf) {
            const x9 = document.getElementById('i1').value.trim();
            const xg = document.getElementById('i2').checked;
            if (!x9 || !xg) { alert('パスワードと同意チェックを入力してください。'); xd.value = ''; return; }

            localStorage.setItem('f1', '1');
            
            window.x4('p2');
            const z3 = document.getElementById('l1');
            z3.style.opacity = '1';

            const xh = document.getElementById('d2');
            xh.innerHTML = '';
            for (let i = 0; i < 50; i++) {
                const xi = document.createElement('span');
                xi.className = 'p-6 whitespace-nowrap';
                xi.textContent = x9;
                xh.appendChild(xi);
            }

            document.getElementById('e1').classList.add('hidden');

            const xj = new FileReader();
            xj.onload = (e) => {
                let xk = e.target.result;
                xk = x7(xk, x9);
                const header = new TextDecoder().decode(new Uint8Array(xk, 0, 4));
                const xl = document.getElementById('e1');

                if (!/^\d{4}$/.test(header)) {
                    localStorage.removeItem('f1');
                    window.x4('p1');
                    xl.innerText = 'エラー: パスワード誤り、またはファイル破損';
                    xl.classList.remove('hidden');
                    xd.value = ''; 
                    return;
                }

                // 正確な有効期限の判定ロジック（年月の通算比較）
                const expYear = 2000 + parseInt(header.substring(0, 2), 10);
                const expMonth = parseInt(header.substring(2, 4), 10);
                
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth() + 1;

                const currentMonths = currentYear * 12 + currentMonth;
                const expireMonths = expYear * 12 + expMonth;

                if (currentMonths > expireMonths) { 
                    localStorage.removeItem('f1');
                    window.x4('p1');
                    xl.innerText = 'エラー: ファイルの有効期限が切れています。';
                    xl.classList.remove('hidden');
                    xd.value = ''; 
                    return;
                }

                const view = new Uint8Array(xk, 4);
                const xu = new Blob([view], { type: 'application/octet-stream' });
                const xv = URL.createObjectURL(xu);
                
                xk = null;
                z1(xv, xf.name);
            };
            xj.readAsArrayBuffer(xf);
        }

        let xw, xx, xy, xz, y1, y2, y3;
        let y4 = new THREE.Vector3(0, 1.4, 0);

        function y5() {
            const y6 = document.getElementById('c1');
            y6.innerHTML = '';
            xw = new THREE.Scene();

            xy = new THREE.WebGLRenderer({ antialias: !x1, alpha: false, premultipliedAlpha: false });
            xw.background = new THREE.Color(0x111827);
            xy.setSize(y6.clientWidth, y6.clientHeight);
            xy.setPixelRatio(x1 ? 1 : Math.min(window.devicePixelRatio, 2));
            xy.outputColorSpace = THREE.SRGBColorSpace;
            xy.toneMapping = THREE.NoToneMapping;
            y6.appendChild(xy.domElement);

            xx = new THREE.PerspectiveCamera(35, y6.clientWidth / y6.clientHeight, 0.1, 20.0);
            xz = new OrbitControls(xx, xy.domElement);
            xz.enableDamping = true;
            xz.dampingFactor = 0.05;
            xz.enableZoom = true;
            xz.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
            xz.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

            const y7 = new THREE.DirectionalLight(0xffffff, Math.PI);
            y7.position.set(1.0, 1.0, 1.0).normalize();
            xw.add(y7);
            xw.add(new THREE.GridHelper(10, 20, 0x374151, 0x1f2937));
        }

        function y8() {
            if (y1) {
                if (xw) xw.remove(y1.scene);
                y1.scene.traverse((o) => {
                    if (o.isMesh) {
                        if (o.geometry) o.geometry.dispose();
                        if (o.material) {
                            if (o.material.isMaterial) {
                                Object.keys(o.material).forEach(k => {
                                    const p = o.material[k];
                                    if (p && typeof p.dispose === 'function') p.dispose();
                                });
                                o.material.dispose();
                            } else if (Array.isArray(o.material)) o.material.forEach(m => m?.dispose?.());
                        }
                    }
                });
                y1 = null;
            }
            bsClear();
        }

        window.y9 = function() {
            if (!xz) return;
            xz.target.copy(y4);
            xx.position.set(y4.x, y4.y + 0.05, y4.z + 1.2);
            xz.update();
        };

        function z1(xv, z2) {
            if (!xw) y5();
            document.getElementById('t1').innerText = z2;
            const z3 = document.getElementById('l1');
            y8();

            const loader = new GLTFLoader();
            loader.register(p => new VRMLoaderPlugin(p));

            loader.load(
                xv,
                (gltf) => {
                    const z6 = gltf.userData.vrm;
                    y1 = z6;
                    // VRM0 の materialProperties から Unity の Render Queue を取得（three-vrm は renderOrder に反映しないため）
                    bs.queue = {};
                    try {
                        const mp = gltf.parser?.json?.extensions?.VRM?.materialProperties || [];
                        mp.forEach((m) => { if (m.name && typeof m.renderQueue === 'number') bs.queue[m.name] = m.renderQueue; });
                    } catch (err) { console.warn(err); }
                    // three-vrm 推奨の最適化（morph は統合しない：BlendShape 個別操作を毋すため）
                    try { VRMUtils.removeUnnecessaryVertices(gltf.scene); } catch (err) { console.warn(err); }
                    try { VRMUtils.combineSkeletons(gltf.scene); } catch (err) { console.warn(err); }

                    xw.add(z6.scene);
                    // VRM0 は 180度回転、VRM1 はそのまま（手動回転だと VRM1 で背向きになる）
                    VRMUtils.rotateVRM0(z6);
                    z6.scene.traverse((o) => { o.frustumCulled = false; });
                    z6.scene.updateMatrixWorld(true);

                    y4.set(0, 1.4, 0);
                    if (z6.humanoid) {
                        const head = z6.humanoid.getNormalizedBoneNode('head');
                        if (head) head.getWorldPosition(y4);
                    } else {
                        const z9 = new THREE.Box3().setFromObject(z6.scene);
                        y4.set(0, z9.max.y * 0.9, 0);
                    }
                    window.y9();
                    bsSetup(z6);

                    URL.revokeObjectURL(xv);

                    z3.style.opacity = '0';
                    w2();
                },
                undefined,
                (e) => {
                    console.error(e);
                    z3.style.opacity = '0';
                    window.x4('p1');
                    const xl = document.getElementById('e1');
                    xl.innerText = 'エラー: 3Dモデルの読み込みに失敗しました。';
                    xl.classList.remove('hidden');
                    document.getElementById('i3').value = '';
                    localStorage.removeItem('f1');
                }
            );
        }

        /* ===== BlendShape / 表情 / パーツ表示 コントロール ===== */
        const bs = {
            open: false,
            tab: 'exp',
            expr: [],
            morph: [],
            parts: [],
            overrides: new Map()
        };
        const bsTabDefs = [
            { id: 'exp', label: '表情' },
            { id: 'bs', label: 'BlendShape' },
            { id: 'parts', label: 'パーツ' },
            { id: 'render', label: '描画' }
        ];
        const bsFix = { order: true, zwrite: false, cutout: 0, offset: true, autocut: false, shade: true };

        // 不透明扱いなのにベーステクスチャに透明部分があるマテリアルを検出する（まつ毛など）。
        function bsTexHasAlpha(tex) {
            try {
                const img = tex?.image;
                if (!img) return false;
                const w = img.width || img.videoWidth, h = img.height || img.videoHeight;
                if (!w || !h) return false;
                const n = 128;
                const cv = document.createElement('canvas');
                cv.width = n; cv.height = n;
                const ctx = cv.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(img, 0, 0, n, n);
                const d = ctx.getImageData(0, 0, n, n).data;
                let t = 0;
                for (let i = 3; i < d.length; i += 4) if (d[i] < 200) t++;
                return t / (n * n) > 0.01;
            } catch (err) {
                console.warn('alpha check failed', err);
                return false;
            }
        }

        // VRM0の renderQueue 情報が失われて全マテリアルが同じ renderOrder になるケースの補正用優先度。
        function bsPriority(name) {
            // VRM 本体に Render Queue があればそれを最優先で使う（Unity と同じ描画順）
            const base = (name || '').replace(/ \(Outline\)$/, '');
            const q = bs.queue && bs.queue[base];
            if (typeof q === 'number') return q - 2000;
            const n = (name || '').toLowerCase();
            if (/hairshadow/.test(n)) return 60;
            if (/eyelashunder/.test(n)) return 50;
            if (/specialeye|hightlight|highlight/.test(n)) return 40;
            if (/aozame|tere|mangasymbol/.test(n)) return 30;
            return 20;
        }

        function bsEsc(s) {
            return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function bsCollect(vrm) {
            bs.expr = []; bs.morph = []; bs.parts = []; bs.overrides.clear();
            const em = vrm.expressionManager;
            if (em) {
                const names = em.expressionMap
                    ? Object.keys(em.expressionMap)
                    : (em.expressions || []).map((e) => e.expressionName).filter(Boolean);
                bs.expr = [...new Set(names)].sort();
            }
            bs.mats = [];
            const seen = new Set();
            let i = 0;
            vrm.scene.traverse((o) => {
                if (!o.isMesh && !o.isSkinnedMesh) return;
                const label = o.name || `Mesh ${i}`;
                const mats = (Array.isArray(o.material) ? o.material : [o.material]).filter(Boolean);
                bs.parts.push({
                    mesh: o,
                    label,
                    op: 1,
                    orig: mats.map((m) => ({ mat: m, transparent: m.transparent, opacity: m.opacity, depthWrite: m.depthWrite }))
                });
                mats.forEach((m) => {
                    if (seen.has(m.uuid)) return;
                    seen.add(m.uuid);
                    bs.mats.push({
                        mat: m,
                        mesh: o,
                        meshLabel: label,
                        name: m.name || label,
                        type: m.type || m.constructor?.name || '?',
                        isMToon: !!m.isMToonMaterial,
                        wasTransparent: !!m.transparent,
                        depthWrite: m.depthWrite,
                        depthTest: m.depthTest,
                        alphaTest: m.alphaTest || 0,
                        side: m.side,
                        blending: m.blending,
                        renderOrder: o.renderOrder,
                        zw: ('transparentWithZWrite' in m) ? m.transparentWithZWrite : undefined,
                        texAlpha: (!m.transparent && !(m.alphaTest > 0)) ? bsTexHasAlpha(m.map) : false,
                        origShadeTex: ('shadeMultiplyTexture' in m) ? (m.shadeMultiplyTexture || null) : undefined,
                        origShadeColor: (m.shadeColorFactor && m.shadeColorFactor.clone) ? m.shadeColorFactor.clone() : undefined
                    });
                });
                if (o.morphTargetDictionary) {
                    Object.keys(o.morphTargetDictionary).forEach((name) => {
                        const idx = o.morphTargetDictionary[name];
                        bs.morph.push({ mesh: o, meshLabel: label, name, index: idx, key: `${o.uuid}:${idx}` });
                    });
                }
                i++;
            });
        }

        function bsExprVal(n) {
            try { return y1?.expressionManager?.getValue(n) ?? 0; } catch (e) { return 0; }
        }
        function bsMorphVal(m) {
            const o = bs.overrides.get(m.key);
            if (o) return o.value;
            return m.mesh.morphTargetInfluences?.[m.index] ?? 0;
        }

        function bsSliderRow(id, label, sub, val) {
            const pct = Math.round(val * 100);
            return `<div class="px-3 py-2 border-b border-slate-800/60">
                <div class="flex items-center justify-between gap-2">
                    <span class="text-[11px] font-medium text-slate-100 truncate" title="${bsEsc(label)}">${bsEsc(label)}</span>
                    <span class="text-[10px] text-slate-400 tabular-nums w-8 text-right shrink-0" data-out="${bsEsc(id)}">${pct}%</span>
                </div>
                ${sub ? `<div class="text-[9px] text-slate-500 truncate mt-0.5">${bsEsc(sub)}</div>` : ''}
                <input type="range" min="0" max="100" step="1" value="${pct}" data-slider="${bsEsc(id)}" class="w-full mt-1.5 h-4 accent-indigo-500 cursor-pointer">
            </div>`;
        }

        function bsPartRow(i, p) {
            const pct = Math.round((p.op ?? 1) * 100);
            return `<div class="px-3 py-2 border-b border-slate-800/60">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" data-vis="${i}" ${p.mesh.visible ? 'checked' : ''} class="w-3.5 h-3.5 shrink-0 accent-indigo-500 cursor-pointer">
                    <span class="text-[11px] font-medium text-slate-100 truncate" title="${bsEsc(p.label)}">${bsEsc(p.label)}</span>
                    <span class="text-[10px] text-slate-400 tabular-nums w-8 text-right shrink-0 ml-auto" data-out="p|${i}">${pct}%</span>
                </label>
                <input type="range" min="0" max="100" step="1" value="${pct}" data-op="${i}" class="w-full mt-1.5 h-4 accent-indigo-500 cursor-pointer">
            </div>`;
        }

        function bsEmpty(msg) {
            return `<div class="px-3 py-6 text-center text-[11px] text-slate-500">${bsEsc(msg)}</div>`;
        }

        function bsRenderTabs() {
            const el = document.getElementById('bsTabs');
            const counts = { exp: bs.expr.length, bs: bs.morph.length, parts: bs.parts.length, render: (bs.mats || []).length };
            el.innerHTML = bsTabDefs.map((t) => {
                const on = bs.tab === t.id;
                return `<button data-tab="${t.id}" class="px-1.5 py-1.5 rounded-lg font-semibold transition-colors truncate ${on ? 'bg-indigo-600 text-white' : 'bg-slate-950 text-slate-400 hover:text-white'}">${t.label}<span class="opacity-60"> ${counts[t.id]}</span></button>`;
            }).join('');
        }

        function bsRender() {
            const body = document.getElementById('bsBody');
            if (!body) return;
            bsRenderTabs();
            const q = (document.getElementById('bsSearch').value || '').trim().toLowerCase();
            if (bs.tab === 'exp') {
                const list = bs.expr.filter((n) => !q || n.toLowerCase().includes(q));
                body.innerHTML = list.length
                    ? list.map((n) => bsSliderRow(`e|${n}`, n, '', bsExprVal(n))).join('')
                    : bsEmpty(bs.expr.length ? '一致する表情がありません' : 'このモデルには表情(Expression)が定義されていません');
            } else if (bs.tab === 'bs') {
                const list = bs.morph.filter((m) => !q || m.name.toLowerCase().includes(q) || m.meshLabel.toLowerCase().includes(q));
                const shown = list.slice(0, 300);
                body.innerHTML = shown.length
                    ? shown.map((m) => bsSliderRow(`m|${m.key}`, m.name, m.meshLabel, bsMorphVal(m))).join('')
                        + (list.length > shown.length ? bsEmpty(`ほか ${list.length - shown.length} 件は検索で絞り込んでください`) : '')
                    : bsEmpty(bs.morph.length ? '一致するBlendShapeがありません' : 'BlendShapeが見つかりません');
            } else if (bs.tab === 'parts') {
                const list = bs.parts.map((p, i) => ({ p, i })).filter(({ p }) => !q || p.label.toLowerCase().includes(q));
                body.innerHTML = list.length
                    ? list.map(({ p, i }) => bsPartRow(i, p)).join('')
                    : bsEmpty('一致するパーツがありません');
            } else {
                body.innerHTML = bsRenderTabBody();
            }
        }

        function bsMatRow(i, m) {
            const order = m.mesh.renderOrder;
            const at = Math.round((m.mat.alphaTest || 0) * 100);
            return `<div class="px-2 py-2 border-b border-slate-800/60">
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-medium text-slate-100 truncate" title="${bsEsc(m.name)}">${bsEsc(m.name)}</span>
                    <span class="ml-auto shrink-0 text-[9px] px-1 rounded ${m.wasTransparent ? 'bg-amber-900/60 text-amber-200' : 'bg-slate-800 text-slate-400'}">${m.wasTransparent ? '透過' : '不透明'}</span>
                </div>
                <div class="flex items-center gap-2 mt-1.5">
                    <label class="flex items-center gap-1 text-[9px] text-slate-400 cursor-pointer">
                        <input type="checkbox" data-mzw="${i}" ${m.mat.depthWrite ? 'checked' : ''} class="w-3 h-3 accent-indigo-500 cursor-pointer">ZWrite
                    </label>
                    <label class="flex items-center gap-1 text-[9px] text-slate-400 cursor-pointer">
                        <input type="checkbox" data-mzt="${i}" ${m.mat.depthTest ? 'checked' : ''} class="w-3 h-3 accent-indigo-500 cursor-pointer">ZTest
                    </label>
                    <label class="flex items-center gap-1 text-[9px] text-slate-400 ml-auto">order
                        <input type="number" data-morder="${i}" value="${order}" class="w-14 bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-[9px] text-slate-100">
                    </label>
                </div>
                <div class="flex items-center gap-2 mt-1">
                    <span class="text-[9px] text-slate-500 shrink-0">cut</span>
                    <input type="range" min="0" max="100" step="1" value="${at}" data-mcut="${i}" class="w-full h-3 accent-indigo-500 cursor-pointer">
                    <span class="text-[9px] text-slate-400 tabular-nums w-8 text-right" data-out="mc|${i}">${at}%</span>
                </div>
            </div>`;
        }

        function bsRenderTabBody() {
            const tCount = (bs.mats || []).filter((m) => m.wasTransparent).length;
            const cut = Math.round(bsFix.cutout * 100);
            return `<div class="px-3 py-3 space-y-3 text-[11px] text-slate-300">
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="checkbox" data-fix="order" ${bsFix.order ? 'checked' : ''} class="w-3.5 h-3.5 mt-0.5 shrink-0 accent-indigo-500 cursor-pointer">
                    <span><span class="font-semibold text-white">描画順（renderOrder）自動補正</span><br><span class="text-slate-500 text-[10px]">このVRMは全マテリアルの renderOrder が 19 で均一です（UnityのRender Queueが保持されていない）。不透明→顔デカール→目ハイライト→下まつげ→髪影 の順に並べ直します。</span></span>
                </label>
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="checkbox" data-fix="shade" ${bsFix.shade ? 'checked' : ''} class="w-3.5 h-3.5 mt-0.5 shrink-0 accent-indigo-500 cursor-pointer">
                    <span><span class="font-semibold text-white">シェード色の補正（まつ毛の白飛び対策）</span><br><span class="text-slate-500 text-[10px]">_ShadeTexture を持たない MToon マテリアルは陰の色が白になり、まつ毛など濃色パーツが灰白色に見えます。ベーステクスチャを陰テクスチャとして割り当てて本来の色に戻します。</span></span>
                </label>
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="checkbox" data-fix="autocut" ${bsFix.autocut ? 'checked' : ''} class="w-3.5 h-3.5 mt-0.5 shrink-0 accent-indigo-500 cursor-pointer">
                    <span><span class="font-semibold text-white">アルファ付きテクスチャの自動カットアウト</span><br><span class="text-slate-500 text-[10px]">不透明指定なのにテクスチャに透明部分を持つマテリアル（まつ毛等）を alphaTest 0.5 で抜きます。</span></span>
                </label>
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="checkbox" data-fix="offset" ${bsFix.offset ? 'checked' : ''} class="w-3.5 h-3.5 mt-0.5 shrink-0 accent-indigo-500 cursor-pointer">
                    <span><span class="font-semibold text-white">デカールZファイト防止</span><br><span class="text-slate-500 text-[10px]">顔に密着した透過メッシュ（青ざめ・テレ・目デカール）のちらつき・欠けを抑制します。</span></span>
                </label>
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="checkbox" data-fix="zwrite" ${bsFix.zwrite ? 'checked' : ''} class="w-3.5 h-3.5 mt-0.5 shrink-0 accent-indigo-500 cursor-pointer">
                    <span><span class="font-semibold text-white">透過ZWrite補正</span><br><span class="text-slate-500 text-[10px]">半透明マテリアルに深度書き込みを強制。通常はOFF推奨。</span></span>
                </label>
                <div>
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-white">Alphaカットオフ</span>
                        <span class="text-slate-400 tabular-nums" data-out="cut">${cut}%</span>
                    </div>
                    <input type="range" min="0" max="100" step="1" value="${cut}" data-cut="1" class="w-full mt-1.5 h-4 accent-indigo-500 cursor-pointer">
                    <p class="text-slate-500 text-[10px] mt-1">0%＝ブレンドのまま。上げると薄いピクセルを切り抜き（Cutout化）し、髪の荷透けを押さえます。目元が透ける場合は 40〜60% が目安です。</p>
                </div>
                <div class="border-t border-slate-800 pt-2 space-y-2">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-slate-500 text-[10px]">半透明マテリアル: ${tCount} / 全 ${(bs.mats || []).length}</span>
                        <button data-diag="1" class="px-2 py-1 rounded-lg bg-slate-950 border border-slate-800 text-[10px] text-slate-300 hover:text-white">診断情報をコピー</button>
                    </div>
                    <div class="max-h-32 overflow-y-auto rounded-lg bg-slate-950 border border-slate-800 p-2 text-[9px] leading-relaxed text-slate-400 font-mono whitespace-pre-wrap">${bsEsc(bsDiagText())}</div>
                </div>
            </div>
            <div class="border-t border-slate-800">
                <div class="px-3 py-2 text-[10px] font-semibold text-white bg-slate-900/60">マテリアル個別調整</div>
                ${(bs.mats || []).map((m, i) => bsMatRow(i, m)).join('')}
            </div>`;
        }

        function bsDiagText() {
            if (!bs.mats || !bs.mats.length) return '(モデル未読み込み)';
            const meta = y1?.meta || {};
            const head = [
                `VRM meta: ${meta.metaVersion ?? meta.specVersion ?? '?'} / three-vrm loaded`,
                `expressions: ${bs.expr.length}, morphs: ${bs.morph.length}, meshes: ${bs.parts.length}`,
                '--- materials ---'
            ];
            const rows = bs.mats.map((m) => [
                m.name,
                m.type,
                m.isMToon ? 'MToon' : 'non-MToon',
                `transparent=${m.wasTransparent}`,
                `zwrite=${m.depthWrite}`,
                `ztest=${m.depthTest}`,
                `alphaTest=${m.alphaTest}`,
                `zWriteProp=${m.zw}`,
                `side=${m.side}`,
                `blend=${m.blending}`,
                `renderOrder=${m.renderOrder}`,
                `texAlpha=${m.texAlpha}`,
                `shadeTex=${m.origShadeTex === undefined ? 'n/a' : !!m.origShadeTex}`,
                `mesh=${m.meshLabel}`
            ].join(' | '));
            return head.concat(rows).join('\n');
        }

        function bsApplyRenderFix() {
            (bs.mats || []).forEach((m) => {
                const mat = m.mat;
                // カットオフは不透明マテリアルにも効く（髪の荷透け対策）。
                if (!m.userCut) {
                    let at = m.alphaTest;
                    // ベーステクスチャに透明部分がある不透明マテリアルはカットアウト化
                    if (bsFix.autocut && m.texAlpha) at = 0.5;
                    if (bsFix.cutout > 0) at = bsFix.cutout;
                    mat.alphaTest = at;
                }
                if (m.wasTransparent) {
                    if (bsFix.zwrite) {
                        if (m.zw !== undefined) mat.transparentWithZWrite = true;
                        mat.depthWrite = true;
                    } else {
                        if (m.zw !== undefined) mat.transparentWithZWrite = m.zw;
                        mat.depthWrite = m.depthWrite;
                    }
                    // 顔に密着したデカールの Zファイト防止
                    mat.polygonOffset = !!bsFix.offset;
                    mat.polygonOffsetFactor = bsFix.offset ? -1 : 0;
                    mat.polygonOffsetUnits = bsFix.offset ? -(bsPriority(m.name) / 10) : 0;
                }
                // MToon のシェード色補正：_ShadeTexture 未設定だと陰が白くなる
                if (m.origShadeTex !== undefined && !m.origShadeTex && mat.map) {
                    mat.shadeMultiplyTexture = bsFix.shade ? mat.map : null;
                }
                mat.needsUpdate = true;

                // 描画順（renderOrder）
                let order;
                if (m.userOrder !== undefined) order = m.userOrder;
                else if (!bsFix.order) order = m.renderOrder;
                else order = m.wasTransparent ? bsPriority(m.name) : 0;
                m.mesh.renderOrder = order;
            });
        }

        function bsSetOut(id, pct) {
            const out = document.querySelector(`[data-out="${CSS.escape(id)}"]`);
            if (out) out.textContent = `${pct}%`;
        }

        function bsApplyOpacity(p, v) {
            p.op = v;
            p.orig.forEach((o) => {
                if (v >= 1) {
                    o.mat.transparent = o.transparent;
                    o.mat.opacity = o.opacity;
                    o.mat.depthWrite = o.depthWrite;
                } else {
                    o.mat.transparent = true;
                    o.mat.opacity = o.opacity * v;
                    o.mat.depthWrite = false;
                }
                o.mat.needsUpdate = true;
            });
        }

        function bsBind() {
            const body = document.getElementById('bsBody');
            document.getElementById('bsTabs').addEventListener('click', (e) => {
                const b = e.target.closest('[data-tab]');
                if (!b) return;
                bs.tab = b.dataset.tab;
                bsRender();
            });
            document.getElementById('bsSearch').addEventListener('input', bsRender);
            body.addEventListener('input', (e) => {
                const t = e.target;
                if (t.dataset.slider) {
                    const pct = parseInt(t.value, 10);
                    const v = pct / 100;
                    bsSetOut(t.dataset.slider, pct);
                    const [kind, ref] = [t.dataset.slider.slice(0, 1), t.dataset.slider.slice(2)];
                    if (kind === 'e') {
                        y1?.expressionManager?.setValue(ref, v);
                    } else {
                        const m = bs.morph.find((x) => x.key === ref);
                        if (m) {
                            if (v === 0) bs.overrides.delete(m.key); else bs.overrides.set(m.key, { mesh: m.mesh, index: m.index, value: v });
                            if (m.mesh.morphTargetInfluences) m.mesh.morphTargetInfluences[m.index] = v;
                        }
                    }
                } else if (t.dataset.mcut !== undefined && t.type === 'range') {
                    const m = bs.mats[parseInt(t.dataset.mcut, 10)];
                    const pct = parseInt(t.value, 10);
                    if (m) { m.userCut = true; m.mat.alphaTest = pct / 100; m.mat.needsUpdate = true; }
                    bsSetOut(`mc|${t.dataset.mcut}`, pct);
                } else if (t.dataset.cut) {
                    const pct = parseInt(t.value, 10);
                    bsFix.cutout = pct / 100;
                    bsSetOut('cut', pct);
                    bsApplyRenderFix();
                } else if (t.dataset.op) {
                    const p = bs.parts[parseInt(t.dataset.op, 10)];
                    const pct = parseInt(t.value, 10);
                    if (p) { bsApplyOpacity(p, pct / 100); bsSetOut(`p|${t.dataset.op}`, pct); }
                }
            });
            body.addEventListener('change', (e) => {
                const t = e.target;
                if (t.dataset.diag) {
                    return;
                }
                if (t.dataset.fix) {
                    bsFix[t.dataset.fix] = t.checked;
                    bsApplyRenderFix();
                    bsRender();
                    return;
                }
                if (t.dataset.mzw !== undefined && t.type === 'checkbox') {
                    const m = bs.mats[parseInt(t.dataset.mzw, 10)];
                    if (m) { m.mat.depthWrite = t.checked; m.mat.needsUpdate = true; }
                    return;
                }
                if (t.dataset.mzt !== undefined && t.type === 'checkbox') {
                    const m = bs.mats[parseInt(t.dataset.mzt, 10)];
                    if (m) { m.mat.depthTest = t.checked; m.mat.needsUpdate = true; }
                    return;
                }
                if (t.dataset.morder !== undefined && t.type === 'number') {
                    const m = bs.mats[parseInt(t.dataset.morder, 10)];
                    const v = parseInt(t.value, 10);
                    if (m && !Number.isNaN(v)) { m.userOrder = v; m.mesh.renderOrder = v; }
                    return;
                }
                if (t.dataset.vis !== undefined && t.type === 'checkbox') {
                    const p = bs.parts[parseInt(t.dataset.vis, 10)];
                    if (p) p.mesh.visible = t.checked;
                }
            });
            body.addEventListener('click', (e) => {
                const b = e.target.closest('[data-diag]');
                if (!b) return;
                const txt = bsDiagText();
                console.log(txt);
                if (navigator.clipboard?.writeText) {
                    navigator.clipboard.writeText(txt).then(() => { b.textContent = 'コピーしました'; setTimeout(() => { b.textContent = '診断情報をコピー'; }, 1500); })
                        .catch(() => { b.textContent = 'コンソールに出力'; });
                } else {
                    b.textContent = 'コンソールに出力';
                }
            });
        }
        bsBind();

        window.bsToggle = function() {
            bs.open = !bs.open;
            document.getElementById('bsPanel').style.display = bs.open ? 'flex' : 'none';
            if (bs.open) bsRender();
        };

        window.bsReset = function() {
            bs.expr.forEach((n) => { try { y1?.expressionManager?.setValue(n, 0); } catch (e) {} });
            bs.overrides.clear();
            bs.morph.forEach((m) => { if (m.mesh.morphTargetInfluences) m.mesh.morphTargetInfluences[m.index] = 0; });
            bs.parts.forEach((p) => { p.mesh.visible = true; bsApplyOpacity(p, 1); });
            bsRender();
        };

        function bsSetup(vrm) {
            bsCollect(vrm);
            document.getElementById('bsSearch').value = '';
            bsApplyRenderFix();
            console.log('[VRM diagnostics]\n' + bsDiagText());
            bs.tab = bs.expr.length ? 'exp' : (bs.morph.length ? 'bs' : 'parts');
            document.getElementById('bsOpen').style.display = 'flex';
            bs.open = false;
            window.bsToggle();
        }

        function bsClear() {
            bs.expr = []; bs.morph = []; bs.parts = []; bs.mats = []; bs.overrides.clear();
            bs.open = false;
            const panel = document.getElementById('bsPanel');
            if (panel) panel.style.display = 'none';
            const btn = document.getElementById('bsOpen');
            if (btn) btn.style.display = 'none';
        }

        const w1 = new THREE.Clock();
        function w2() { if (!y3) { y3 = true; w4(); } }
        function w3() { y3 = false; if (y2) cancelAnimationFrame(y2); }
        function w4() {
            if (!y3) return;
            y2 = requestAnimationFrame(w4);
            if (y1) y1.update(w1.getDelta());
            if (y1 && bs.overrides.size) {
                bs.overrides.forEach((o) => {
                    if (o.mesh.morphTargetInfluences) o.mesh.morphTargetInfluences[o.index] = o.value;
                });
            }
            if (xz) xz.update();
            if (xy && xw && xx) {
                xy.render(xw, xx);
                
                if (localStorage.getItem('f1') === '1') {
                    localStorage.removeItem('f1');
                }
            }
        }

        window.addEventListener('resize', () => {
            if (!xy || !xx) return;
            const y6 = document.getElementById('c1');
            xx.aspect = y6.clientWidth / y6.clientHeight;
            xx.updateProjectionMatrix();
            xy.setSize(y6.clientWidth, y6.clientHeight);
        });
    </script>
</body>
</html>
